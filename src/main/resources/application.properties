spring.application.name=Book Recommendation Engine

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/book_recommendation
spring.datasource.username=postgres
spring.datasource.password={YOUR_DATABASE_PASSWORD}

# Hibernate/JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Google Books API Configuration
google.books.api.key={YOUR_GOOGLE_BOOKS_API_KEY}
google.books.api.base-url=https://www.googleapis.com/books/v1
google.books.api.max-results=10

# Embedding microservice
embedding.service.url=http://127.0.0.1:5000/embed

# HTTP client timeouts (milliseconds)
# connect-timeout: max time to establish a TCP connection
# read-timeout: max time to wait for data after the connection is open
http.client.connect-timeout-ms=3000
http.client.read-timeout-ms=5000